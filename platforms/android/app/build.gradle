apply plugin: 'com.android.application'

def doSkipNdk = project.hasProperty('SKIP_NDK') && SKIP_NDK.equals('true')
def isNdkArguments = project.hasProperty('NDK_ARGUMENTS') && !NDK_ARGUMENTS.isEmpty()
def ignoreAssets = project.hasProperty('IGNORE_ASSETS') && !IGNORE_ASSETS.isEmpty()
def linkGooglePlay = project.hasProperty('LINK_GOOGLE_PLAY_LIB') && LINK_GOOGLE_PLAY_LIB.equals('true')
def linkLocalytics = project.hasProperty('LINK_LOCALYTICS') && LINK_LOCALYTICS.equals('true')
def doIncludeSigning =  project.hasProperty('key.store') && project.hasProperty('key.store.password') &&
                        project.hasProperty('key.alias') && project.hasProperty('key.alias.password')

android {
    compileSdkVersion 36
    namespace = PACKAGE_ID

    defaultConfig {
        applicationId PACKAGE_ID
        minSdkVersion MIN_SDK_VERSION
        targetSdkVersion TARGET_SDK_VERSION
        versionCode VERSION_CODE as int
        versionName VERSION_NAME

        if (!doSkipNdk) {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }

            if (isNdkArguments) {
                externalNativeBuild {
                    ndkBuild {
                        arguments NDK_ARGUMENTS
                    }
                }
            }
        }
    }

    if (!linkGooglePlay) {
        sourceSets.main.java.exclude '**/dk/area9/flowrunner/FlowGooglePlayServices.java'
        sourceSets.main.java.exclude '**/dk/area9/flowrunner/FlowGooglePlayServicesLocationListener.java'
        sourceSets.main.java.exclude '**/dk/area9/flowrunner/FlowFirebaseMessagingService.java'
        sourceSets.main.java.exclude '**/dk/area9/flowrunner/FlowFirebaseInstanceIDService.java'
    } else {
        sourceSets.main.java.exclude '**/dk/area9/flowrunner/FlowGooglePlayServicesStub.java'
    }

    if (doIncludeSigning) {
        signingConfigs {
            sign {
                def props = project.getProperties()

                storeFile file("../" + props['key.store'])
                storePassword props['key.store.password']
                keyAlias props['key.alias']
                keyPassword props['key.alias.password']
            }
        }
    }

    buildTypes {
        release {
            // Enable R8 full-mode shrinking, optimization and obfuscation so the
            // published bundle includes R8 metadata and passes Google Play's DEX
            // code-optimization threshold. Keep rules live in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (ignoreAssets) {
                aaptOptions {
                    ignoreAssetsPattern IGNORE_ASSETS
                }
            }

            if (doIncludeSigning) {
                signingConfig signingConfigs.sign
            }
        }

        debug {
            if (doIncludeSigning) {
                signingConfig signingConfigs.sign
            }
        }
    }

    if (!doSkipNdk) {
        externalNativeBuild {
            ndkBuild {
                path 'src/main/jni/Android.mk'
            }
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_21
        sourceCompatibility JavaVersion.VERSION_21
    }
    ndkVersion = '30.0.14904198'
    buildToolsVersion '36.1.0'
}

configurations.all {
    // socket.io-client 2.1.2 -> engine.io-client 2.1.0 pins okio 1.15.0, which is
    // affected by CVE-2023-3635 (GzipSource throws on a malformed gzip buffer ->
    // denial of service). We never call okio ourselves, but okhttp's
    // BridgeInterceptor transparently gunzips responses through GzipSource, so a
    // hostile signalling server could hang the WebRTC socket. 1.17.6 is the fix on
    // the 1.x line: binary compatible with okhttp 3.12.12 and no Kotlin runtime.
    // engine.io-client 2.1.0 is the newest release, so the okhttp 3.12.12 floor
    // (CVE-2021-0341, only fixed in okhttp 4.9.2+) cannot be raised without a
    // major-version jump - see platforms/android/README.md.
    resolutionStrategy.force 'com.squareup.okio:okio:1.17.6'
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
    implementation('io.socket:socket.io-client:2.1.2') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.annotation:annotation:1.7.0"
    if (linkLocalytics) {
        implementation files('libs/localytics.jar')
        implementation 'com.android.support:support-compat:28.0.0'
    }
    if (linkGooglePlay) {
        implementation 'com.google.firebase:firebase-analytics:22.4.0'
        implementation 'com.google.firebase:firebase-messaging:24.1.1'
        implementation 'com.google.android.gms:play-services-location:21.3.0'
    }
}

if (linkGooglePlay) {
    apply plugin: 'com.google.gms.google-services'
}
