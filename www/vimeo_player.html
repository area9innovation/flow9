<!DOCTYPE html>
<html>
	<head>
		<style lang="css">
			html, body, iframe {
				display: block;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				background: transparent;
			}
		</style>
		<script src="js/toflow.js?2"></script>
		<script src="https://player.vimeo.com/api/player.js" onload="if (window.onVimeoSdk) window.onVimeoSdk();" onerror="window.vimeoSdkFailed = true;"></script>
	</head>
<body>
	<!-- Vimeo wrapper for MVideoVimeoPlayer, same {loadVideo}/{playerState} protocol as yt_player.html.
	     Without the SDK the video is shown as a plain iframe (no state reporting). -->
	<script>
		var player = null, iframe = null, sender = null, lastSent = {}, current = null, pendingState = null;
		var loaded = null, loadedWithSdk = false, wanted = null, announced = false, readyTimer = null;
		var seeking = false, seekTarget = 0, seekSeq = 0, seekPending = 0, stateSeq = 0;
		var SDK_WAITS = 300, READY_TIMEOUT = 10000, SEEK_TIMEOUT = 5000, UPGRADE_WINDOW = 30000, MAX_SAVED = 20;
		var fallbackAt = 0;

		function statusOf() {
			if (current.ended) return "ENDED";
			if (current.buffering && !current.paused) return "BUFFERING";
			return current.paused ? "PAUSED" : "PLAYING";
		}

		function sendChanges() {
			if (!current) return;
			var state = {
				status: statusOf(),
				duration: current.duration,
				currentTime: current.currentTime
			};
			// the volume is unknown until the first real read: a `muted=1` embed must not be reported as 100
			if (current.volume !== null) state.volume = Math.round(current.volume * 100);
			lastSent = postPlayerStateChanges(state, lastSent);
		}

		function refresh() {
			if (!player) return;
			var p = player, gen = stateSeq, vol = current ? current.volume : null;
			// getVolume is not supported on iOS, and Promise.all is all-or-nothing: without this the whole poll dies there
			Promise.all([p.getPaused(), p.getEnded(), p.getCurrentTime(), p.getDuration(),
				p.getVolume().catch(function () { return vol; })])
				.then(function (r) {
					// a poll issued before applyState would otherwise report the state flow has just asked us to leave
					if (p !== player || !current || gen !== stateSeq) return;
					current.paused = r[0]; current.ended = r[1]; current.duration = r[3]; current.volume = r[4];
					if (!seeking) current.currentTime = r[2]; // the old position is still reported until the seek lands
					sendChanges();
				})
				.catch(function () {});
		}

		// Vimeo may reload the iframe (forcereload=drm) and drop the listeners: re-attach on `loaded`, poll as a backup
		function attach() {
			var events = {
				play: function () { current.paused = false; current.ended = false; current.buffering = false; sendChanges(); },
				pause: function () { current.paused = true; sendChanges(); },
				ended: function () { current.ended = true; current.paused = true; sendChanges(); },
				bufferstart: function () { current.buffering = true; sendChanges(); },
				bufferend: function () { current.buffering = false; sendChanges(); },
				timeupdate: function (d) { if (!seeking) current.currentTime = d.seconds; current.duration = d.duration; sendChanges(); },
				// a backstop for the setCurrentTime promise, but only for the seek that is actually the last one requested
				seeked: function (d) { if (seeking && seekPending <= 1 && Math.abs(d.seconds - seekTarget) < 0.5) { seeking = false; current.currentTime = d.seconds; sendChanges(); } },
				volumechange: function (d) { current.volume = d.volume; sendChanges(); }
			};
			for (var name in events) {
				player.off(name);
				player.on(name, events[name]);
			}
		}

		function dropPlayer() {
			if (sender) { clearInterval(sender); sender = null; }
			if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
			if (player) { try { player.destroy(); } catch (e) {} player = null; }
			if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
			iframe = null;
			current = null;
			lastSent = {};
			pendingState = null; // state queued for this video must not be applied to the next one
			seeking = false;
			seekSeq++; // a seek still in flight must not land on the next video's state
		}

		// `ready` tells flow the player is in place: on load (a live video never reports a duration), without the SDK or on error
		function sendReady() {
			if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
			if (announced) return; // `loaded` fires again on Vimeo's own reloads
			announced = true;
			postToFlow({playerState: {ready: true}});
		}

		// The URL arrives over postMessage: only the Vimeo player itself may be framed here
		function isVimeoPlayerURL(url) {
			try {
				var u = new URL(url, window.location.href);
				return u.protocol === "https:" && u.hostname === "player.vimeo.com";
			} catch (err) {
				return false;
			}
		}

		function createIframe(url, params, onload) {
			var src = url;
			if (params && params.loop && src.indexOf("loop=") < 0) src += (src.indexOf("?") < 0 ? "?" : "&") + "loop=1";
			iframe = document.createElement("iframe");
			iframe.setAttribute("allow", "autoplay; fullscreen; picture-in-picture; encrypted-media");
			iframe.setAttribute("allowfullscreen", "");
			iframe.setAttribute("frameborder", "0");
			iframe.onload = onload;
			iframe.src = src;
			document.body.appendChild(iframe);
		}

		function createPlayer(url, params, waits) {
			var key = JSON.stringify([url, params]);
			// the same request is a no-op, unless we fell back to a plain iframe and the SDK has arrived since
			if (key === loaded && iframe && (loadedWithSdk || typeof Vimeo === "undefined")) return;

			if (!isVimeoPlayerURL(url)) {
				// the previous video would otherwise keep playing and keep reporting as if it were the new one
				dropPlayer();
				loaded = null;
				wanted = null;
				announced = false;
				sendReady();
				return;
			}

			// the budget is per load: a slow first video must not spend the grace period of the next one
			waits = waits || 0;
			if (waits > 0 && key !== wanted) return; // a newer loadVideo arrived while we waited for the SDK
			wanted = key;
			if (typeof Vimeo === "undefined" && !window.vimeoSdkFailed && waits < SDK_WAITS) {
				setTimeout(createPlayer, 10, url, params, waits + 1);
				return;
			}

			dropPlayer();
			announced = false;
			var hasSdk = typeof Vimeo !== "undefined";
			createIframe(url, params, hasSdk ? null : sendReady);
			// `onload`, `loaded` and `error` can all stay silent when the frame itself is blocked: flow must not wait forever
			readyTimer = setTimeout(sendReady, READY_TIMEOUT);
			loaded = key;
			loadedWithSdk = hasSdk;
			if (!hasSdk) { fallbackAt = Date.now(); return; } // SDK unavailable: plain iframe, no state reporting

			current = {paused: true, ended: false, buffering: false, currentTime: 0, duration: 0, volume: null};
			try {
				player = new Vimeo.Player(iframe);
				player.on("loaded", function () { sendReady(); attach(); refresh(); applyPending(); });
				player.on("error", sendReady);
				attach();
				player.ready().then(function () { refresh(); applyPending(); }).catch(sendReady);
				sender = setInterval(refresh, 250);
			} catch (err) {
				console.error("vimeo_player: cannot attach the API player", err);
				dropPlayer(); // the half-built player would keep a live `current` and an orphan iframe
				loaded = null; // let the same URL be retried
				loadedWithSdk = false;
				sendReady();
			}
		}

		function applyPending() {
			if (!pendingState || !player) return;
			var s = pendingState;
			pendingState = null;
			applyState(s);
		}

		// play/pause/seek/setVolume are async: the request is recorded as the current state too, or the next
		// sendChanges reads the value it is about to replace and posts it back to flow
		function applyState(s) {
			if (!player || !current) return;
			stateSeq++;
			if ("status" in s) {
				if (s.status === "PLAYING") { current.paused = false; current.ended = false; player.play().catch(function () {}); }
				else if (s.status === "PAUSED") { current.paused = true; player.pause().catch(function () {}); }
				lastSent.status = s.status;
			}
			if ("volume" in s) {
				current.volume = s.volume / 100;
				player.setVolume(current.volume).catch(function () {});
				lastSent.volume = s.volume;
			}
			if ("loop" in s) player.setLoop(!!s.loop).catch(function () {});
			if ("currentTime" in s) {
				current.currentTime = s.currentTime;
				lastSent.currentTime = s.currentTime;
				// while a seek is in flight the player still reports the old position: hold it back, and while the user
				// drags the scrub bar hold it back for the whole drag, so only the last seek of a run is reported
				seeking = true;
				seekTarget = s.currentTime;
				var seek = ++seekSeq, settled = false;
				seekPending++;
				// counted down exactly once however the seek ends: a leak here would disable the `seeked` backstop for good
				var settle = function () { if (!settled) { settled = true; seekPending--; } };
				// the SDK leaves the promise unsettled when the frame never becomes ready: without this the position
				// would stay held back for the life of the player
				setTimeout(function () { settle(); if (seek === seekSeq) seeking = false; }, SEEK_TIMEOUT);
				player.setCurrentTime(s.currentTime)
					.then(function (t) {
						settle();
						if (seek !== seekSeq || !current) return; // superseded by a newer seek, or by another video
						seeking = false;
						current.currentTime = t;
						sendChanges();
					})
					.catch(function () { settle(); if (seek === seekSeq) seeking = false; });
			}
		}

		// flow reloads the iframe whenever it moves it in the DOM, so the last loadVideo is kept per frame and replayed
		// without a frame id there is nothing stable to key on: a per-instance key loses the replay, but two players
		// on one page would otherwise share a slot and come back as each other's video
		var savedKey = "flowPlayer:" + (window.frameElement && window.frameElement.id
			? window.frameElement.id
			: "anon" + Math.random().toString(36).slice(2));

		// the clip id is random per widget, so the entries would pile up for the whole session: keep the newest ones only
		function pruneSaved(keep) {
			try {
				var entries = [];
				for (var i = 0; i < sessionStorage.length; i++) {
					var k = sessionStorage.key(i);
					if (k && k.indexOf("flowPlayer:") === 0 && k !== savedKey) {
						var at = 0;
						try { at = JSON.parse(sessionStorage.getItem(k)).at || 0; } catch (e) {}
						entries.push({key: k, at: at});
					}
				}
				entries.sort(function (a, b) { return b.at - a.at; });
				for (var j = keep; j < entries.length; j++) sessionStorage.removeItem(entries[j].key);
			} catch (err) {}
		}

		function saveLoad(load) {
			var entry = JSON.stringify({at: Date.now(), load: load});
			try {
				sessionStorage.setItem(savedKey, entry);
			} catch (err) {
				// out of quota: without the prune the replay this mechanism exists for would silently stop working
				pruneSaved(5); // keep a few recent ones: the other live frames replay from theirs too
				try { sessionStorage.setItem(savedKey, entry); } catch (e) {}
			}
		}

		// the SDK can arrive after the wait budget ran out and the plain iframe was put up: upgrade that to the API player
		window.onVimeoSdk = function () {
			// rebuilding restarts the video, so only right after the fallback went up, never under a watching user
			if (!loaded || loadedWithSdk || Date.now() - fallbackAt > UPGRADE_WINDOW) return;
			try {
				var key = JSON.parse(loaded);
				createPlayer(key[0], key[1]);
			} catch (err) {}
		};

		window.addEventListener("message", function (e) {
			// only the flow page that embeds this wrapper may drive it
			if (e.source !== window.parent || e.origin !== window.location.origin) return;
			try {
				var data = JSON.parse(e.data);
				if ("loadVideo" in data) {
					saveLoad(data.loadVideo);
					createPlayer(data.loadVideo.url, data.loadVideo.params || {});
				}
				if ("playerState" in data) {
					if (player) applyState(data.playerState);
					else pendingState = Object.assign(pendingState || {}, data.playerState);
				}
			} catch (err) {
				console.error("vimeo_player: cannot handle the message from flow", err);
			}
		});

		try {
			var saved = sessionStorage.getItem(savedKey);
			if (saved) {
				saved = JSON.parse(saved);
				var load = saved.load || saved; // an entry saved before the timestamp was added
				if (load && load.url) { saveLoad(load); createPlayer(load.url, load.params || {}); } // a replayed entry is live, not stale
			}
		} catch (err) {}
		pruneSaved(MAX_SAVED);
	</script>
</body>
</html>
