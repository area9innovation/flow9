<!DOCTYPE html>
<html>
	<head>
		<style lang="css">
			html, body, iframe {
				display: block;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}
		</style>
		<script src="js/toflow.js"></script>
	</head>
<body>
	<div id="player"></div>

	<script>
		var tag = document.createElement('script'), firstScriptTag = document.getElementsByTagName('script')[0];
		tag.src = "https://www.youtube.com/iframe_api";
		firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

		var player, sender, apiReady = false, pendingState = null;
		function onYouTubeIframeAPIReady() {
			apiReady = true;
		}

		function createYTPlayer(videoId, params = {}) {
			if (apiReady) {
				var autoplay = params.autoplay == 1;
				params.enablejsapi = 1;

				if (!('origin' in params)) params.origin = window.location.host;
				if (!('start' in params)) params.start = 0;

				var playerParams = {
					height: '100%',
					width: '100%',
					playerVars : params,
					events: {
						onReady: (e) => {
							player.ready = true;
							videoInfo = {videoId : videoId};
							if (typeof params.start !== 'undefined' && params.start >= 0) videoInfo.startSeconds = params.start;
							if (typeof params.end !== 'undefined') videoInfo.endSeconds = params.end;
							if (autoplay) {
								player.loadVideoById(videoInfo);
							} else {
								player.cueVideoById(videoInfo);
							}
							player.lastSended = {};
							sender = setInterval(sendChanges, 33);
							postToFlow({playerState: {ready: true}}); // a live video never reports a duration
							if (pendingState) {
								var queued = pendingState;
								pendingState = null;
								applyPlayerState(queued);
							}
						},
						onStateChange: (e) => {
							var currentState = e.data,
								currentTime = player.getCurrentTime(),
								duration = player.getDuration(),
								end = (params.end > params.start && params.end < duration) ? params.end : duration;

							if (params.loop == 1 && currentState === YT.PlayerState.ENDED) {
								player.seekTo(params.start);
								player.playVideo();
							}
							if (
								player.lastState === YT.PlayerState.ENDED
								&& currentState === YT.PlayerState.PLAYING
								&& (Math.abs(end - currentTime) < 0.1 || currentTime < 0.1) // on rewind
							) {
								player.seekTo(params.start);
							}
							player.lastState = currentState;
						}
					}
				};

				if ('nocookie' in params && params.nocookie === true) {
					playerParams.host = 'https://www.youtube-nocookie.com';
				}

				player = new YT.Player('player', playerParams);
			} else {
				setTimeout(createYTPlayer, 10, videoId, params)
			}
		}

		function getPlayerState() {
			state = player.getPlayerState();
			switch (state) {
				case YT.PlayerState.ENDED:
					status = "ENDED";
					break;
				case YT.PlayerState.PLAYING:
					status = "PLAYING";
					break;
				case YT.PlayerState.PAUSED:
					status = "PAUSED";
					break;
				case YT.PlayerState.BUFFERING:
					status = "BUFFERING";
					break;
				case YT.PlayerState.CUED:
					status = "CUED";
					break;
				default:
					status = "UNKNOWN";
					break;
			}
			return {
				status: status,
				volume: player.getVolume(),
				duration: player.getDuration(),
				currentTime: player.getCurrentTime()
			};
		}
		function sendChanges() {
			if (player.ready) {
				var currentState = getPlayerState(), changedState = {}, n = 0;
				for (var field in currentState) {
					if (!(field in player.lastSended) || currentState[field] !== player.lastSended[field]) {
						changedState[field] = currentState[field];
						n++;
					}
				}
				if (n > 0) {
					postToFlow({playerState : changedState});
					player.lastSended = currentState;
				}
			}
		}
		function applyPlayerState(playerState) {
			clearInterval(sender);
			var currentState = getPlayerState();

			if ('status' in playerState && currentState.status !== playerState.status) {
				switch (playerState.status) {
					case "PLAYING":
						player.playVideo();
						break;
					case "PAUSED":
						player.pauseVideo();
						break;
					default:
				}
				player.lastSended.status = playerState.status;
			}
			if ('volume' in playerState && currentState.volume !== playerState.volume) {
				player.setVolume(playerState.volume);
				if (playerState.volume > 0) {
					player.unMute();
				}
				player.lastSended.volume = playerState.volume;
			}
			if ('loop' in playerState) {
				player.setLoop(playerState.loop);
				player.lastSended.loop = playerState.loop;
			}
			if ('currentTime' in playerState && currentState.currentTime !== playerState.currentTime) {
				player.seekTo(playerState.currentTime);
				player.lastSended.currentTime = playerState.currentTime;
			}
			sender = setInterval(sendChanges, 33);
		}

		window.addEventListener("message", function (e) {
			try {
				var data = JSON.parse(e.data);

				if ('loadVideo' in data) {
					createYTPlayer(data.loadVideo.videoId, data.loadVideo.params);
				}

				if ('playerState' in data) {
					// reading the state of a player that is not ready throws, and the poll would stay cleared for good.
					// The state is kept for onReady instead of dropped, or flow's own state stays ahead of the player.
					if (!player || !player.ready) {
						pendingState = Object.assign(pendingState || {}, data.playerState);
					} else {
						applyPlayerState(data.playerState);
					}
				}

			} catch (err) {
				console.error("yt_player: cannot handle the message from flow", err);
			}
		});
	</script>
</body>
</html>
