<!DOCTYPE html>
<html>
	<head>
		<style lang="css">
			html, body, iframe {
				display: block;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				background: transparent;
				overflow: hidden;
			}
			.video-js {
				width: 100%;
				height: 100%;
			}
		</style>
		<script src="js/toflow.js?2"></script>
	</head>
<body>
	<!-- Brightcove wrapper for MVideoBrightcovePlayer, same {loadVideo}/{playerState} protocol as yt_player.html.
	     Uses the in-page embed (video.js API) built from players.brightcove.net/{account}/{player}_{embed}/index.html?videoId=,
	     the iframe embed exposes no events. Falls back to that iframe if the player script does not load. -->
	<script>
		var player = null, playerReady = false, sender = null, lastSent = {}, pendingState = null;

		function param(query, name) {
			var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(query);
			return m ? decodeURIComponent(m[1]) : null;
		}

		function statusOf() {
			if (player.ended()) return "ENDED";
			if (player.paused()) return player.hasStarted() ? "PAUSED" : "CUED";
			return player.readyState() < 3 ? "BUFFERING" : "PLAYING";
		}

		function sendChanges() {
			if (!playerReady) return;
			lastSent = postPlayerStateChanges({
				status: statusOf(),
				volume: player.muted() ? 0 : Math.round(player.volume() * 100),
				duration: isFinite(player.duration()) ? player.duration() : 0,
				currentTime: player.currentTime()
			}, lastSent);
		}

		function dropPlayer() {
			if (sender) { clearInterval(sender); sender = null; }
			if (player) { try { player.dispose(); } catch (e) {} player = null; }
			playerReady = false;
			var old = document.getElementById("player");
			if (old && old.parentNode) old.parentNode.removeChild(old);
			lastSent = {};
		}

		function fallbackIframe(url) {
			dropPlayer();
			var f = document.createElement("iframe");
			f.id = "player";
			f.setAttribute("allow", "autoplay; fullscreen; picture-in-picture; encrypted-media");
			f.setAttribute("allowfullscreen", "");
			f.onload = function () { postToFlow({playerState: {ready: true}}); };
			f.src = url;
			document.body.appendChild(f);
		}

		function createPlayer(url, params) {
			var path = url.split("players.brightcove.net/")[1] || "";
			var parts = path.split("?")[0].split("/");
			var query = url.indexOf("?") >= 0 ? url.substr(url.indexOf("?")) : "";
			var account = parts[0], playerEmbed = parts[1] || "default_default";
			var playerId = playerEmbed.split("_")[0], embed = playerEmbed.split("_")[1] || "default";
			var videoId = param(query, "videoId"), autoplay = param(query, "autoplay"), muted = param(query, "muted");
			if (!account || !videoId) { fallbackIframe(url); return; }

			dropPlayer();
			var el = document.createElement("video-js");
			el.id = "player";
			el.setAttribute("data-account", account);
			el.setAttribute("data-player", playerId);
			el.setAttribute("data-embed", embed);
			el.setAttribute("data-video-id", videoId);
			el.setAttribute("controls", "");
			el.setAttribute("playsinline", "");
			if (autoplay !== null && autoplay !== "false") el.setAttribute("autoplay", autoplay === "" ? "true" : autoplay);
			if (muted !== null && muted !== "false") el.setAttribute("muted", "");
			if (params && params.loop) el.setAttribute("loop", "");
			document.body.appendChild(el);

			var script = document.createElement("script");
			script.src = "https://players.brightcove.net/" + account + "/" + playerEmbed + "/index.min.js";
			script.onerror = function () { fallbackIframe(url); };
			script.onload = function () {
				if (typeof bc !== "function") { fallbackIframe(url); return; }
				player = bc(el);
				player.ready(function () {
					playerReady = true;
					lastSent = {};
					["play", "pause", "ended", "playing", "waiting", "timeupdate", "volumechange", "loadedmetadata", "durationchange"].forEach(function (name) {
						player.on(name, sendChanges);
					});
					sender = setInterval(sendChanges, 250);
					postToFlow({playerState: {ready: true}});
					sendChanges();
					applyPending();
				});
			};
			document.head.appendChild(script);
		}

		function applyPending() {
			if (!pendingState || !player) return;
			var s = pendingState;
			pendingState = null;
			applyState(s);
		}

		function applyState(s) {
			if ("status" in s) {
				if (s.status === "PLAYING") { var p = player.play(); if (p && p.catch) p.catch(function () {}); }
				else if (s.status === "PAUSED") player.pause();
				lastSent.status = s.status;
			}
			if ("volume" in s) {
				player.volume(s.volume / 100);
				if (s.volume > 0) player.muted(false);
				lastSent.volume = s.volume;
			}
			if ("loop" in s) player.loop(!!s.loop);
			if ("currentTime" in s) {
				player.currentTime(s.currentTime);
				lastSent.currentTime = s.currentTime;
			}
		}

		window.addEventListener("message", function (e) {
			try {
				var data = JSON.parse(e.data);
				if ("loadVideo" in data) createPlayer(data.loadVideo.url, data.loadVideo.params || {});
				if ("playerState" in data) {
					if (playerReady) applyState(data.playerState);
					else pendingState = Object.assign(pendingState || {}, data.playerState);
				}
			} catch (err) {}
		});
	</script>
</body>
</html>
