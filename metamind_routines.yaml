# AI-driven maintenance this repository asks a Dev Box to perform.
#
# Read from the reviewed default branch and never from a working tree, so a
# branch cannot change what an unattended agent is told to do. A box runs none
# of these until an account arms them in the Web Agent.
#
# This repository is PUBLIC, and every routine here is written for that:
# nothing internal in a commit, a pull request or a comment; a finding that
# cannot be fixed safely in the open stays on the box (`wt routine say`) and is
# never written into the repository; a binary enters only a pull request a
# person merges, and only with a verified upstream signature; no routine runs
# on other people's branches.
#
# `claude-opus-5` is the floor for every routine: these agents work unattended,
# and a cheaper model that misreads a compile error or a decoder costs a
# person's afternoon. `effort` is the dial instead: `medium` here, `high` for
# the sweep, where telling a real bound check from a cosmetic one is judgment.
#
# Format: Studio's docs/prd-scheduled-repo-routines.md.
version: 1
routines:
  - id: compile-check
    title: Keep the build compiling
    cadence: { every: 24h, at: '06:10' }
    branch: routine/compile-check
    base: master
    prTitle: 'fix: compile errors'
    engine: { cli: claude-code, model: claude-opus-5, effort: medium }
    verify: bin/flowc1 tools/flowc/flowc.flow && bin/flowc1 lib/material/material.flow
    limits: { runMinutes: 120 }
    prompt: |
      This repository is PUBLIC. Nothing you commit, write in a pull request or
      say in a comment names an internal host, a path on this machine, an
      account, a customer or an internal URL. What cannot be said in public goes
      to the box instead: `wt routine say` (one line under 4,000 characters;
      several for a list) lands in a run log only the people this routine is
      shared with can read.

      Compile with `bin/flowc1 <file>` (Java only: nothing native, no LFS):

        tools/flowc/flowc.flow          the compiler
        lib/material/material.flow      the UI library, which pulls in most of lib/
        every .flow file changed in {{sinceSha}}..{{headSha}} (recent history
        when that reads empty), outside tools/flowc/tests/

      `flowc1` exits 1 on any error. Do not use `unittests=1`: it writes
      tools/flowc/tests/out/ into the tree and exits 0 whatever it finds. Do not
      compile the fixtures under tools/flowc/tests/: some are meant to fail.

      If everything compiles, report `nothing-to-do` and stop. That is a good
      outcome, not a failure to find work.

      Otherwise, for each failure, find the commit that made it fail. Start with
      {{sinceSha}}..{{headSha}}, the {{commitCount}} commits since this routine
      last ran; `git log` on the file usually suffices, and a `git bisect` probes
      with the one failing file, never everything, and ends with `git bisect
      reset` before you edit anything. Then read that commit's pull request (the
      `#NNNN` in its message, or `gh pr list --search <sha> --state merged`), or
      its message when it has none. The ground truth is neither the error nor
      the code: it is what that pull request set out to do.

      - If it meant to change this, the caller is outdated. Update the caller,
        and in the pull request body name the commit and quote the sentence
        that intended the change.
      - If it did not, the change regressed. Fix it without undoing what that
        pull request set out to do.
      - If you cannot fix it without undoing it, the two contradict. Touch
        neither and report it: the file, the commit and both readings. A person
        decides which is wrong; you do not.
      - If no commit makes it fail (a toolchain or box change), report it the
        same way.

      Never make a failure pass by deleting a module, commenting out an import
      or weakening a type, except under the first bullet with the quote in the
      body. Never commit tools/flowc/flowc.jar: you fix the compiler's sources,
      and a person rebuilds the jar with bin/build-flowc.

      More than ten failing files is not one run's work: take ten and list the
      rest in the body under "Needs a person", so the next run continues.

      A report goes in the pull request body under "Needs a person", beside
      what you fixed. With nothing fixed there is no pull request to carry it;
      report `cannot-resolve` with the list instead. `failed` is for a run that
      could not do its work: the compiler would not start, or the verify did
      not pass.

      Fix what is broken and nothing else. A green compile with an unrelated
      refactor in the diff is a worse pull request than a green compile alone.

  - id: security-review
    title: Security review
    cadence: { every: 24h, at: '07:10' }
    branch: routine/security-review
    base: master
    prTitle: 'fix: hardening'
    engine: { cli: claude-code, model: claude-opus-5, effort: medium }
    # Haxe, neko and the Haxe libraries, so a run can build the JavaScript
    # targets. A run does its work without them, so a failure here is a fact
    # for the agent and not the end of the run.
    prelude:
      - run: mise trust --quiet && mise install --yes
        onFailure: hand-to-agent
      - run: mise run haxelib-setup
        onFailure: hand-to-agent
    verify: bin/flowc1 tools/flowc/flowc.flow && bin/flowc1 lib/material/material.flow
    limits: { runMinutes: 120 }
    # Parts of the review method in this prompt are adapted from the
    # `security-review` command of anthropics/claude-code-security-review
    # (https://github.com/anthropics/claude-code-security-review),
    # MIT License, Copyright (c) 2025 Anthropic.
    prompt: |
      This repository is PUBLIC. Nothing you commit, write in a pull request or
      say in a comment names an internal host, a path on this machine, an
      account, a customer or an internal URL, and nothing describes a defect in
      a way that hands someone an attack. What cannot be said in public goes to
      the box instead: `wt routine say` (one line under 4,000 characters;
      several for a list) lands in a run log only the people this routine is
      shared with can read.

      Review everything committed since this routine last ran
      ({{sinceSha}}..{{headSha}}, {{commitCount}} commits; recent history when
      that reads empty) for security defects. Follow the method below, not the
      built-in `/security-review`: that one reviews a branch against its base,
      and this branch starts at its base, so its diff is empty. It also leaves
      out resource exhaustion and missing hardening, which are in scope here,
      and it forbids running commands, while this review measures.

      Report only what the range introduced. A defect that was there before the
      range is not a finding of this review; note it in one line as "seen, not
      new".

      A defect in flow9 is a defect in every product built on it. Give specific
      attention to changes in:

        - decoders and parsers fed by the network or a document: fromBinary in
          lib/text/binary.flow, the base64, UTF-8 and JSON natives in
          platforms/common/cpp, platforms/java and platforms/js, lib/formats/**
          (unchecked lengths, quadratic time on attacker-sized input: the base64
          and UTF-8 decoders were made linear recently, and that class recurs);
        - the native runtime, platforms/common/cpp/**: the bytecode loader, the
          x64 JIT, gl-gui and font (indices and lengths read from the bytecode
          or a file, integer overflow on sizes);
        - the browser runtime, platforms/js/**: HTML sanitising through DOMPurify,
          postMessage origin checks, eval in Native, RenderSupport and WebClip,
          URL and cookie handling;
        - server natives and libraries: platforms/java (HttpServerSupport,
          WebSocketServerSupport, Database.java and escapeDb, FlowJwt,
          FlowCrypto, FlowPassword), the Node natives in platforms/js,
          lib/server/**, lib/net/**, lib/sys/process.flow, lib/fs/**,
          lib/jwt.flow, lib/crypto_aes.flow, lib/webauthn;
        - the PHP files under www/ and the compile server
          (tools/flowc/flowc_server.flow, server-mode=http).

      Read the range. Diff the range, never the branch against its base:

        git log --no-merges --format='%h %s' {{sinceSha}}..{{headSha}}
        git diff --stat {{sinceSha}}..{{headSha}}
        git diff {{sinceSha}}..{{headSha}} -- <path>

      When that log is empty, recent history is the last 20 commits on master;
      say in the report that you used it. Read a large change one commit at a
      time (`git show <sha> -- <path>`).

      Sort the changed files into two groups, and keep the list for the report:

        - read closely: code that takes input from the network, a document or a
          file; the runtimes; server natives; the areas above;
        - skipped, each with its reason: documentation, files that only tests
          use, changes that are only layout or wording.

      Before you judge a change, learn how the code around it protects itself:
      the escaping, sanitising and validation functions in use, and where the
      siblings of the changed function call them; where input enters, and which
      side of a trust boundary the changed code is on; the checks a similar
      decoder, parser or native already makes. A change that leaves an
      established pattern, or that opens a new way in, is the first place to
      look.

      Read the whole function and its callers, not only the changed lines, and
      follow the data from where it enters to where it is used. Look for:

        - input and memory: a length, index, offset or count from the input
          that is used before it is checked; a size computation that can
          overflow; in the C++ runtime a read or a write outside a buffer or a
          use after free; a loop or a recursion that scans the rest of the
          input again for each element; a recursion whose depth the input sets;
          a pattern that backtracks without bound;
        - injection and code execution: input that reaches SQL, a shell or a
          process argument, `eval`, a file path (path traversal) or a URL whose
          host or protocol it controls; HTML or script that reaches the page
          without the sanitiser its siblings use; XML entities; serialised data
          decoded into structures that the caller then trusts;
        - authentication and authorisation: a path that skips a check its
          siblings make; a way to act as another user or with more rights; the
          signature, algorithm, expiry and audience of a JWT; a cookie without
          the flags its siblings set;
        - cryptography and secrets: a key, password or token written in the
          code; a weak algorithm or mode; a predictable source of randomness; a
          comparison of a secret that is not constant-time; certificate or
          signature validation that is skipped or made optional;
        - data exposure: a secret, a password or personal data in a log, an
          error message or a response; debug output or an endpoint that returns
          more than its caller may see;
        - consistency: a sibling of the changed function has a check that this
          one lacks.

      A rewrite of a parser or a decoder is one unit of work for a sub-agent.
      Give it the diff, the version before the range and these questions, and
      ask it to compare the old and the new code on the same inputs.

      What you find this way is a candidate. It is a finding only after you
      verify it, each candidate independently of the others; a sub-agent for
      each one is the usual way.

        - Trace the input. Find the guards above the code, and confirm that
          input from outside reaches it.
        - Measure when a measure exists. Compile a small driver (`bin/flowc1
          jar=…` needs only Java; CLAUDE.md says how to compile). For time, run
          it at sizes that double and read the growth. For behaviour, compare
          the output before and after the range.
        - Keep drivers and their output outside the tree, or delete them before
          a commit.

      Drop a candidate that matches one of these, unless you can show a
      concrete path from outside input to harm:

        - a missing rate limit, or load that any service has under many
          requests (time or memory that grows faster than the input is a
          finding);
        - a general best practice the code does not follow, with no input that
          makes it matter (a missing bound on input from outside is a finding);
        - missing validation of a field that no security decision depends on;
        - a secret or credential on disk that is otherwise protected;
        - a value from an environment variable or a command-line flag: the
          person who runs the program sets them, and they are trusted;
        - a missing permission check in client-side code, or missing validation
          of input the client only sends on: the server is where both must be;
        - a race or a timing attack that is only theoretical;
        - an outdated third-party library: the dependency audit handles those;
        - a memory-safety defect in a memory-safe language (flow, Java, Haxe,
          JavaScript, safe Rust); in C++ it is a finding;
        - unsanitised input in a log line, and the logging of a URL or of data
          that is neither secret nor personal;
        - a request forgery that controls only the path of a URL;
        - input in a regular expression as such (unbounded backtracking is a
          finding);
        - a missing audit log, a resource that is not released, a file
          descriptor leak;
        - a file that only tests use, a notebook, a documentation file;
        - a shell script or a CI workflow, unless input nobody trusts reaches
          it;
        - tabnabbing, cross-site leaks, prototype pollution and open redirects,
          unless the path is certain;
        - a guessed UUID: a UUID may be taken as unguessable.

      Give each candidate that is left a confidence from 1 to 10 that it is
      real. 8 to 10: the path from input to effect is traced, and measured or
      reproduced where that is possible. 4 to 7: a suspicious pattern that
      needs conditions you could not confirm. 1 to 3: probably noise. Only 8
      and above is a finding. Each candidate below 8 is dropped, and you name
      it with its score and the reason. When the effect would be serious and
      the score is 6 or 7, say so: a person decides whether to look again.

      Give each finding a severity. High: directly usable for code execution,
      a data breach or an authentication bypass. Medium: needs specific
      conditions, and the effect is significant. Low: defence in depth, a
      missing bound or a slow path with no practical way to use it against a
      deployment.

      Two kinds of finding, and only the first becomes a pull request here:

        1. Hardening with no practical exploit path (severity low): a missing
           bound, a quadratic decoder, a check made consistent with its
           siblings. Fix it at the root, with a test that fails without the
           fix, verify, push, and describe the behaviour change in the body,
           never the input that triggers it.
        2. A defect exploitable against a product built on this runtime
           (severity medium or high). DO NOT PUSH. This repository is public,
           and a fix pushed here is a disclosure before anyone deploying flow9
           has the fix. Say the finding to the box (file, line, the class of
           defect, severity, confidence and how you verified it, worded for a
           maintainer) and report `cannot-resolve`. A person takes it through
           private vulnerability reporting.

      If you are not sure which kind a finding is, it is the second.

      A run that pushed hardening and also holds a finding of the second kind
      reports `review-ready` for the pull request once checks are green, and
      says the finding; the say line is what the person reads.

      If the commits contain nothing security-relevant, report `nothing-to-do`.

      The report has a public part and a private part. The pull request body
      holds the range and the number of commits, the files read closely, the
      files skipped with their reasons, and for each fix the file, the
      behaviour change and how it was verified. With no pull request, the
      range and the file lists go to the box. Everything else goes to the
      box with `wt routine say`, one line each, whatever the run reports: each finding of the second kind, each dropped candidate with
      its score and reason, each defect seen that is not new, and what you
      could not verify. A list of suspected defects with file and line is a
      map; it never enters a commit, a pull request or a comment.

  - id: dependency-audit
    title: Dependency audit and safe upgrades
    cadence: { every: 7d, at: '08:10' }
    branch: routine/dependency-audit
    base: master
    prTitle: 'fix(deps): dependency audit and safe upgrades'
    engine: { cli: claude-code, model: claude-opus-5, effort: medium }
    # An advisory arrives without anyone committing, so a quiet week is when
    # this matters most.
    idle: run
    # node and npm from mise.toml, for the `npm audit` fallback. A run needs
    # them only when the alerts API refuses, so a failure here is a fact for
    # the agent and not the end of the run.
    prelude:
      - run: mise trust --quiet && mise install --yes
        onFailure: hand-to-agent
    verify: bin/flowc1 tools/flowc/flowc.flow && bin/flowc1 lib/material/material.flow
    limits: { runMinutes: 150 }
    prompt: |
      This repository is PUBLIC. Nothing you commit, write in a pull request or
      say in a comment names an internal host, a path on this machine, an
      account, a customer or an internal URL. What cannot be said in public goes
      to the box instead: `wt routine say` (one line under 4,000 characters;
      several for a list) lands in a run log only the people this routine is
      shared with can read.

      Audit this repository's dependencies and fix what can be fixed safely, in
      one pull request: every run, over everything, not only what changed. The
      risk here arrives by sitting still.

      Dependabot is enabled. It alerts within hours on every manifest GitHub's
      dependency graph reads (here the npm and Ruby lockfiles) and opens its own
      fix pull requests. It is the first line, not you: never touch a package
      it has an open pull request for.

      1. Dependabot's leftovers. List its open alerts and its open pull requests:

           gh api 'repos/{owner}/{repo}/dependabot/alerts?state=open' --paginate
           gh pr list --author app/dependabot --state open

         An alert with a Dependabot pull request is counted, nothing more. For
         each alert without one, find why, and whether shipped code loads the
         package or only a dev or build tool does. Fix it here when a patched
         version is reachable without crossing a major: inside the declared
         range, or as an `overrides` entry for a transitive package. If the
         alerts API refuses this account, say so and fall back to
         `npm audit --omit=dev`, read-only, in each folder with a lockfile.

      2. What Dependabot cannot see:
         - platforms/java/lib/*.jar, declared in flow.config `java-dependencies`;
         - www/js/** vendored browser libraries (the version is in each file's
           header);
         - platforms/android/*.gradle declarations;
         - a new install script on a package that did not have one, and a
           dependency nothing references any more (both listed, not changed).
         For each: the version in the tree, the latest, open advisories by id.
         Fix the ones with an advisory.

      How a fix is made:
        - Same major only. A newer major, a changed licence, or a release that
          removes an API this repository uses is not bumped. Where the upstream
          fix is a small, self-contained commit, backport it into the vendored
          file instead and say so; otherwise list the package for a person.
        - Every artifact is verified before it is committed. A jar: Maven
          Central's checksum, and a good PGP signature from the same key that
          signed the jar it replaces (verify that jar's own .asc too), checked
          in a throwaway GNUPGHOME with the key fetched over HTTPS from
          https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x<key id>
          (`gpg --recv-keys` fails intermittently). A vendored
          file: the npm registry's sha512 integrity of the package it comes
          from, and the same file of that package (minified for minified). A
          check that fails, or cannot run on this box, means the package is
          listed and not bumped.
        - Never let package code run: no `npm install`, `npm ci` or
          `npm audit fix` without `--ignore-scripts`, and nothing else installs.
        - ONE COMMIT PER PACKAGE, with every reference updated (flow.config,
          README tables, build files) and the message
          `fix(deps): bump <package> from <old> to <new>`, its body naming the
          advisory ids and how the artifact was verified.
        - After each jar commit, compile platforms/java/com/area9innovation/flow
          against platforms/java/lib: the list of javac errors must be the same
          as on master (some sources need jars this repository does not ship).
          After each vendored-file commit, find every place that loads it and
          check the names it reads still exist. An Android bump that needs a
          code change is listed, not made: this box cannot build Android.
        - A package you cannot get through these checks comes out of the
          branch and is listed.
        - tools/flowc/flowc.jar, tools/flowc_lsp/flowc_lsp.jar and
          lib/tools/flow9/flow9.jar bundle the java-dependencies jars. Never
          rebuild them; say in the body which bumped libraries they still carry.

      The pull request body lists each fixed package on one line: package,
      from and to, advisory ids, how it was verified, and for an Android bump
      "not built". Advisory ids only: never say how an advisory applies to this
      runtime. What is not fixed (majors, failed checks, licence changes, dead
      dependencies) goes to the box with `wt routine say`, newest advisory
      first, never into the pull request. Report `review-ready` once verify
      passes. With nothing fixed there is no pull request: report
      `nothing-to-do` with the counts.

  - id: runtime-security-sweep
    title: Runtime security sweep
    cadence: { every: 7d, at: '09:10' }
    branch: routine/runtime-security-sweep
    base: master
    prTitle: 'docs: security sweep coverage'
    # `high`: a real bound check and a cosmetic one read the same, and a low
    # band drowns the box in false positives.
    engine: { cli: claude-code, model: claude-opus-5, effort: high }
    # The security review reads only new commits; this grinds the standing
    # surface, so a quiet spell is exactly when it earns its keep.
    idle: run
    # Haxe, neko and the Haxe libraries, so a run can build the JavaScript
    # targets. A run does its work without them, so a failure here is a fact
    # for the agent and not the end of the run.
    prelude:
      - run: mise trust --quiet && mise install --yes
        onFailure: hand-to-agent
      - run: mise run haxelib-setup
        onFailure: hand-to-agent
    limits: { runMinutes: 180 }
    prompt: |
      This repository is PUBLIC. Nothing you commit, write in a pull request or
      say in a comment names an internal host, a path on this machine, an
      account, a customer or an internal URL, and nothing describes a defect in
      a way that hands someone an attack. What cannot be said in public goes to
      the box instead: `wt routine say` (one line under 4,000 characters;
      several for a list) lands in a run log only the people this routine is
      shared with can read.

      The security review reads only new commits. This sweep reads the standing
      code where a defect in flow9 is a defect in every product built on it, a
      bounded slice per run, so that over months the surface is covered once and
      then kept.

      The surface, highest exposure first:

        1. input fed by the network or a document: fromBinary in
           lib/text/binary.flow; the base64, UTF-8 and JSON decoders in
           platforms/common/cpp, platforms/java and platforms/js;
           lib/formats/**; image and font loaders under
           platforms/common/cpp/font and gl-gui;
        2. the bytecode loader and the JIT, platforms/common/cpp/core/** and the
           asmjit-backed x64 backend: everything that reads a length or an index
           out of the bytecode;
        3. the browser runtime, platforms/js/**: DOMPurify use, postMessage,
           eval, URL and cookie handling, WebClip;
        4. server natives and libraries: platforms/java http, websocket,
           Database.java, FlowJwt, FlowCrypto, FlowPassword; the Node natives in
           platforms/js; lib/server/**, lib/net/**, lib/sys/process.flow,
           lib/fs/**, lib/jwt.flow, lib/crypto_aes.flow, lib/password.flow,
           lib/webauthn;
        5. the PHP files under www/, the compile server and the LSP.

      This is an AUDIT, not an edit. Take up to 25 files this cycle that you
      have not audited before: docs/security-sweep-coverage.md records which
      paths were covered and when (create it on the first cycle), and it holds
      paths and dates ONLY, never a finding. For each file look for unchecked
      lengths and indices, integer overflow on sizes, quadratic work on
      attacker-sized input, injection (SQL, shell, HTML, header), origin and
      authentication checks, and secrets handling.

      Findings never enter the repository. A committed list of suspected
      defects with file and line is a map, and this repository is public. Each
      finding goes to the box with `wt routine say`, one per line: file, line,
      the class of defect and the input shape, worded for a maintainer and not
      for an attacker. Never change product code in this branch; a fix waits
      for a person's decision, in its own pull request.

      The only file you change is docs/security-sweep-coverage.md: append this
      cycle's paths and the date. Commit, push, and keep the one pull request
      updated; its body says only how many files were covered and how many
      remain. Report `review-ready` when it is pushed. If the slice surfaces
      nothing, still record the paths and say so: a clean slice is a good
      outcome, not a failure to find work.
