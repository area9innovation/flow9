# Toolchain for working on flow9 itself. `mise install` once, then the tasks below
# work from a fresh shell. Projects using flow9 keep their own mise.toml.

[tools]
# flowc.jar is committed and run on whatever JDK each checkout has - CI agents,
# developers, projects pinning their own java - so it must load on the oldest of
# them, Java 21 (bin/check_java_version.java). A newer JDK builds a jar that must
# not be pushed; raise this together with that check.
java = "temurin-21"
# Haxe compiles the JavaScript targets (js=, es6=, nodejs=1, html=, ts=) and the
# runtime tests in tests/js/binflow_buffer. haxelib is a neko executable, so neko
# comes with it. The backends are named in full: mise keeps the backend a tool was
# first installed with, and the layout of the install differs between them. neko
# versions are written with dashes.
"github:HaxeFoundation/neko" = { version = "2-4-1" }
# haxelib does not find libneko on its own; mise-tasks/haxelib-patch wraps it.
# `when = "always"` reruns the patch on every `mise install`, so a neko bump does
# not leave haxelib pointing at the old one. Called directly rather than through
# `mise run`, because haxe is still mid-install at that point.
"github:HaxeFoundation/haxe" = { version = "4.3.6", depends = ["github:HaxeFoundation/neko"], postinstall = { when = "always", run = 'bash "$MISE_CONFIG_ROOT/mise-tasks/haxelib-patch"' } }
# npm for the lockfiles in platforms/capacitor, resources/vscode/flow,
# resources/webfonts, sandbox/ts and tests/js/text_input_sanitizer, and for the
# `npm audit` the dependency-audit routine falls back to. Without a node here,
# mise's npm shim fails unless a global default or another npm is on the PATH.
# @capacitor/cli 8 needs 22 or newer; 26 is the Active LTS line.
node = "26"

[env]
_.path = ["{{ config_root }}/bin"]

[tasks.build-flowc]
description = "Rebuild tools/flowc/flowc.jar from the compiler sources"
run = "bin/build-flowc"

[tasks."flowcpp:docker-build"]
description = "Build QtByteRunner in an Ubuntu 24.04 container; extra arguments go to qmake"
run = "platforms/qt/docker/runner-build/build.sh"

[tasks."flowcpp:docker-shell"]
description = "A shell in the QtByteRunner build container, checkout mounted at /flow"
run = "platforms/qt/docker/runner-build/build.sh --shell"
# interactive, needs the terminal
raw = true
